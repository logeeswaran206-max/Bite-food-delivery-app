<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bite — Food Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span class="logo">bite</span>
  <input id="q" class="search" placeholder="Search restaurants or cuisines">
  <button class="cartbtn" id="openCart">Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>Hungry? Get it delivered in 30 minutes.</h1>
  <p>Order from restaurants near you.</p>
</section>

<main>
  <div class="chips" id="chips"></div>
  <div class="bar">
    <h2 id="title">Restaurants</h2>
    <select id="sort">
      <option value="">Sort by</option>
      <option value="rating">Rating</option>
      <option value="time">Delivery time</option>
      <option value="price">Price: low to high</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel"></aside>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
